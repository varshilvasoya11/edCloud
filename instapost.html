<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* .body{
            display: flex;
            justify-content: center;
            align-items: center;
        } */
        .post{
            height: 600px;
            width: 300px;
            border-radius: 20px;
            border: 1px solid black;
        }
        .scr{
            width: 300px;
            height: 470px;
        }
        img{
            height: 100%;
            width: 100%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .pannel{
            height: 40px;
            width: 100%;
            border: 1px solid black;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            overflow: hidden;
            
        }
        .like{
            font-size: large;
        }
        .comment{
            font-size: large;
        }
        .add{
            height: 20px;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 5px;
            visibility: hidden; 
        }
        .list{
            height: 60px;     
            overflow-y: auto;
        }
        .list ul{
            margin: 0;
            padding-left: 20px;
        }
        </style>
</head>
<body>
    <div class="post">
        <div class="scr">
            <img src="insta.jpeg" alt="">
        </div>
        <div class="pannel">
            <div class="like"><i class="bi bi-heart" style="font-size: 32px; color: black;"></i>1013</div>
            <div class="comment"><i class="bi bi-chat" style="font-size:32px; margin:10px;"></i>500</div>
            <div class="shere"><i class="bi bi-send" style="font-size:32px; margin:10px;"></i>156</div>
            <div class="save"><i class="bi bi-bookmark" style="font-size:32px; margin:10px;"></i></div>
        </div>
        <div class="add">
            <input type="text" id="comm">
            <button>comment</button>
        </div>
        <div class="list">
            <ul></ul>
        </div>
    </div>

    <script>
        let like=document.querySelector('.scr')
        let dbl=document.querySelector('.like')
        like.addEventListener('dblclick',()=>{
            dbl.innerHTML='<i class="bi bi-heart-fill" style="font-size: 32px; color: #ED4956;"></i>1014'
        })
        dbl.addEventListener('click',()=>{
            dbl.innerHTML='<i class="bi bi-heart" style="font-size: 32px; color: black;"></i>1013'
        })

        let comment=document.querySelector('.comment')
        let addcomment=document.querySelector('.add')
        let btn=document.querySelector('button')
        let addlist=document.querySelector('ul')
        let input = document.getElementById("comm")

        comment.addEventListener('click',()=>{
            if(addcomment.style.visibility=="hidden"){
                addcomment.style.visibility="visible"
            }
            else{
                addcomment.style.visibility="hidden"
            }
        })

        btn.addEventListener('click', () => {
            addlist.innerHTML += `<li>${input.value}</li>`;
            input.value = "";
        });

        let count=156
        let shere=document.querySelector('.shere')
        shere.addEventListener('click',()=>{
            count++;
            shere.innerHTML='<i class="bi bi-send" style="font-size:32px; margin:10px;"></i>'+count       
        })

        let save=document.querySelector('.save')
        save.addEventListener('click',()=>{
            if(save.innerHTML=='<i class="bi bi-bookmark" style="font-size:32px; margin:10px;"></i>'){
                save.innerHTML='<i class="bi bi-bookmark-fill" style="font-size:32px;"></i>'
            }
            else{
                save.innerHTML='<i class="bi bi-bookmark" style="font-size:32px; margin:10px;"></i>'
            }
        })
    </script>

</body>
</html>
