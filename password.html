<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validation</title>
</head>
<body>

<label>Password:</label>
<input type="text" id="password" onkeyup="checkPassword()">
<span id="msg"></span>

<script>
    function checkPassword() {
        let pass = document.getElementById("password").value
        let msg = document.getElementById("msg")    

        let special = "!@#$%^&*"
        let up=false
        let number = false
        let symbol = false

        for (let i = 0; i < pass.length; i++) {
            if(pass[i]>='A' && pass[i]<='Z'){
                up=true
            }

            if (pass[i] >= '0' && pass[i] <= '9') {
                number = true
            }

            if (special.includes(pass[i])) {
                symbol = true
            }
        }

        if(up==false){
            document.getElementById("msg").textContent = "Add a Uppercase letter"
            document.getElementById("msg").style.color = "red"
        }
        else if (number == false) {
            document.getElementById("msg").textContent = "Add a number"
            document.getElementById("msg").style.color = "red"
        }
        else if (symbol == false) {
            document.getElementById("msg").textContent = "Add a special character"
            document.getElementById("msg").style.color = "red"
        }
        else if (pass.length < 8) {
            document.getElementById("msg").textContent = "Minimum 8 characters"
            document.getElementById("msg").style.color = "red"
        }
        else {
            document.getElementById("msg").textContent = "Strong Password"
            document.getElementById("msg").style.color = "green"
        }
    }
</script>

</body>
</html>
